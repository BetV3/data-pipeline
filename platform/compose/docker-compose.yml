name: data-pipeline-platform

services:
  postgres:
    image: postgres:16
    container_name: dpp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 3s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: dpp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dpp-kafka
    depends_on:
      - zookeeper
    ports:
      # External access from your host (producer/consumer running on your machine)
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

      # Two listener endpoints:
      # - PLAINTEXT: for other containers on the compose network
      # - PLAINTEXT_HOST: for your host machine
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # Single-node dev-friendly settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Keep it explicit for “platform feel”
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dpp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "
      echo 'Creating topics...' &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ${KAFKA_TOPIC_EVENTS:-events} --partitions ${KAFKA_TOPIC_EVENTS_PARTITIONS:-3} --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic ${KAFKA_TOPIC_DLQ:-events_dlq} --partitions 1 --replication-factor 1 &&
      echo 'Topics ready.' &&
      kafka-topics --bootstrap-server kafka:29092 --list 
      "
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dpp-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
  
  schema-registry:
    profiles: ["schemas"]
    image: confluentinc/cp-schema-registry:8.0.3
    container_name: dpp-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${SCHEMA_REGISTRY_PORT:-8085}:8081'
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:29092"

  adminer:
    image: adminer:latest
    container_name: dpp-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8081}:8080"

  # ---------------------------
  # Observability (profile: obs)
  # ---------------------------

  postgres-exporter:
    profiles: ["obs"]
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dpp-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"

  kafka-exporter:
    profiles: ["obs"]
    image: danielqsj/kafka-exporter:latest
    container_name: dpp-kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:latest
    container_name: dpp-prometheus
    depends_on:
      - postgres-exporter
      - kafka-exporter
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:latest
    container_name: dpp-grafana
    depends_on:
      - prometheus
      - postgres
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
  # ---------------------------
  # App containers (profile: apps)
  # ---------------------------

  producer:
    profiles: ["apps"]
    build:
      context: ../../apps/producer-python
      dockerfile: Dockerfile
    container_name: dpp-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: ${KAFKA_TOPIC_EVENTS:-events}
      EVENTS_PER_SEC: ${EVENTS_PER_SEC:-25}
      RUN_SECONDS: ${RUN_SECONDS:-10}
      EVENT_TYPE: ${EVENT_TYPE:-event_received}
      EVENT_SOURCE: "producer-python"
      PRODUCER_METRICS_PORT: "9101"
    ports:
      - "9101:9101"
    restart: "no"

  consumer:
    profiles: ["apps"]
    build:
      context: ../../apps/consumer-python
      dockerfile: Dockerfile
    container_name: dpp-consumer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_started
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: ${KAFKA_TOPIC_EVENTS:-events}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-raw-events-writer}
      POSTGRES_DSN: "postgresql://platform:platform@postgres:5432/platform"
      POLL_MS: ${POLL_MS:-1000}
      CONSUMER_METRICS_PORT: "9102"
    ports:
      - "9102:9102"
    restart: unless-stopped



volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
